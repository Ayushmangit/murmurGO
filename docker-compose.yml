services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: murmur
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U murmur"]
      interval: 2s
      timeout: 2s
      retries: 15
  # load tests: docker compose run --rm k6 run /load/feed.js
  k6:
    image: grafana/k6:2.4.0
    profiles: [load]
    network_mode: bridge
    volumes:
      - ./load:/load
    environment:
      BASE_URL: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
